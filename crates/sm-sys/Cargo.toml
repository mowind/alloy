[package]
name = "alloy-sm-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

#[lib]
#name = "sm"
#path = "src/lib.rs"

[dependencies]
alloy-primitives.workspace = true
elliptic-curve.workspace = true

ecdsa-core = { version = "0.16.8", package = "ecdsa", default-features = false, features = [
  "der",
] }
signature = { version = "2.2", features = ["rand_core"] }
sm2 = { version = "0.13.3", features = ["dsa"] }
sm3 = { version = "0.4", default-features = false }

[build-dependencies]
bindgen = { version = "0.72.1" }


[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
